# Radovin árfigyelő – CI (guide §19)
# A CI kódot és fixture-okat validál, de az ÉLŐ SHOP oldalakat NEM kaparja
# (a scrape a `node run.js`-ben fut, modulo kézi / ütemezett, soha CI-ban).
# A `dry-run` egy szintetikus katalógus-fixture-ral igazolja a minőségi kaput és a
# tranzakciós publikálást, temp-könyvtárba írva – a tracked fájlok érintetlenek maradnak.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
