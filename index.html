<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radovin Árfigyelő</title>
<style>
  :root{--bor:#6b1d1d;--bor-dark:#4a1212;--crema:#faf5ee;--krem:#f3ead9;--arany:#b8860b;--zold:#2e7d32;--piros:#c0392b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--crema);color:#2a2a2a;line-height:1.55;}
  header{background:linear-gradient(135deg,var(--bor),var(--bor-dark));color:#f5e9d6;padding:30px 22px;text-align:center;border-bottom:4px solid var(--arany);}
  header h1{font-size:26px;letter-spacing:.5px;}
  header .meta{font-size:13px;color:#d9c09a;margin-top:6px;}
  .container{max-width:1200px;margin:0 auto;padding:24px 18px 60px;}
  .tab-row{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid #e0d3bb;flex-wrap:wrap;}
  .tab{padding:10px 16px;cursor:pointer;border:none;background:none;font-size:14px;color:#5d5d5d;border-bottom:3px solid transparent;}
  .tab.active{color:var(--bor);border-bottom-color:var(--bor);font-weight:600;}
  .panel{display:none;}
  .panel.active{display:block;}
  .card{background:#fff;border:1px solid #e0d3bb;border-radius:8px;padding:16px 18px;margin-bottom:14px;}
  .termek-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .termek-head h3{color:var(--bor);font-size:17px;}
  .rank-badge{padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;}
  .rank-1{background:#e8f5e9;color:var(--zold);}
  .rank-mid{background:#fff8e1;color:#8a6d00;}
  .rank-last{background:#fdecea;color:var(--piros);}
  .rank-na{background:#eee;color:#888;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{border:1px solid #e8dec8;padding:8px 10px;text-align:left;}
  thead th{background:var(--bor);color:#f5e9d6;font-size:12px;}
  tbody tr:nth-child(even){background:#faf4e8;}
  .ar-ft{font-weight:600;white-space:nowrap;}
  .ar-own{background:#fff4d6 !important;font-weight:700;}
  .min{color:var(--zold);}
  .max{color:var(--piros);}
  .hiba{color:var(--piros);}
  .status-chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;}
  .status-ok{background:#e8f5e9;color:var(--zold);}
  .status-na{background:#eee;color:#888;}
  .status-hiba{background:#fdecea;color:var(--piros);}
  .status-figya{background:#fff8e1;color:#8a6d00;}
  .legend{font-size:12px;color:#666;margin-top:4px;}
  .note{font-size:12px;color:#777;font-style:italic;margin-top:6px;}
  footer{background:var(--bor-dark);color:#d9c09a;text-align:center;padding:18px;font-size:12px;}
</style>
</head>
<body>

<header>
  <h1>🍷 Radovin Árfigyelő</h1>
  <div class="meta" id="meta-sor">Betöltés…</div>
</header>

<div class="container">
  <div class="tab-row">
    <button class="tab active" data-panel="jelen">📊 Jelenlegi állapot</button>
    <button class="tab" data-panel="elozmeny">🕓 Árelőzmények</button>
    <button class="tab" data-panel="tarhaz">📦 Terméktárház</button>
  </div>

  <div class="toolbar" id="kelcso" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;">
    <input type="text" id="kereso" placeholder="Keresés termékre…" style="flex:1;min-width:220px;padding:10px 12px;border:1px solid #d8c8a8;border-radius:6px;font-size:14px;">
  </div>

  <!-- JELENLEGI ÁLLAPOT -->
  <div class="panel active" id="panel-jelen">
    <div id="jelen-list"></div>
  </div>

  <!-- ELŐZMÉNYEK -->
  <div class="panel" id="panel-elozmeny">
    <div id="elozmeny-list"></div>
  </div>

  <!-- TERMÉKTÁRHÁZ (gyűjtött konkrét termékek URL-kulcsú idősorral) -->
  <div class="panel" id="panel-tarhaz">
    <div class="toolbar" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;">
      <input type="text" id="tarhaz-kereso" placeholder="Keresés a gyűjtött termékek közt…" style="flex:1;min-width:220px;padding:10px 12px;border:1px solid #d8c8a8;border-radius:6px;font-size:14px;">
      <span class="note" id="tarhaz-meta"></span>
    </div>
    <div id="tarhaz-list"></div>
  </div>
</div>

<footer>Radovin Árfigyelő · 8 óránkénti frissítés · GitHub: RobertClaw202604/radovin-arfigyelo</footer>

<script>
// ---- Tab-vezérlés ----
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
  document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active');});
  t.classList.add('active');
  document.getElementById('panel-'+t.dataset.panel).classList.add('active');
});});

// ---- Adatok ----
var legutobbi=null, elozmeny=null, tarhaz=null;

function rankOsztaly(p){
  if(!p||!p.rank) return 'rank-na';
  if(p.rank===1) return 'rank-1';
  if(p.rank===p.darab) return 'rank-last';
  return 'rank-mid';
}
function rankCimke(p){
  return p && p.rank ? (p.rank+'. hely ('+p.darab+' ár)') : 'nincs adat';
}
function shopStatuszChip(a){
  if(!a.hiba && a.ar!=null) return '<span class="status-chip status-ok">✓ ár</span>';
  if(a.hiba==='nincs_talalat'||a.hiba==='no_exact_match') return '<span class="status-chip status-na">nincs pontos egyezés</span>';
  if(a.hiba) return '<span class="status-chip status-hiba">forrás hiba</span>';
  return '<span class="status-chip status-na">—</span>';
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

async function betolt(){
  try{
    var a=await fetch('data/legutobbi.json').then(function(r){return r.ok?r.json():null;});
    var b=await fetch('data/elozmeny.json').then(function(r){return r.ok?r.json():null;});
    var t=await fetch('data/termekek.json').then(function(r){return r.ok?r.json():null;});
    legutobbi=a; elozmeny=b; tarhaz=t;
    if(a) document.getElementById('meta-sor').innerHTML='Utolsó frissítés: <strong>'+new Date(a.ido).toLocaleString('hu-HU')+'</strong> · '+a.termekekszam+' termék';
    jelenRendre();
    elozmenyRendre();
    tarhazRendre();
  }catch(e){ document.getElementById('meta-sor').textContent='Nem sikerült betölteni az adatokat.'; }
}

function jelenRendre(){
  var wrap=document.getElementById('jelen-list');
  if(!legutobbi || !legutobbi.eredmenyek || !legutobbi.eredmenyek.length){ wrap.innerHTML='<div class="card">Még nincs adat.</div>'; return; }
  var q=(document.getElementById('kereso').value||'').toLowerCase();
  var list=legutobbi.eredmenyek.filter(function(e){return e.termek_nev.toLowerCase().includes(q);});
  wrap.innerHTML=list.map(function(p){
    var pz=p.pozicio||{};
    var sorok=(p.arak||[]).map(function(a){
      var cls= a.shop==='radovin'? 'ar-own' : (a.ar===pz.min?'min':(a.ar===pz.max?'max':''));
      return '<tr class="'+cls+'">'+
        '<td><strong>'+esc(a.shop_nev||a.shop)+'</strong>'+(a.shop==='radovin'?' <span style="color:var(--arany)">(Radovin)</span>':'')+'</td>'+
        '<td>'+esc(a.nev||'—')+'</td>'+
        '<td class="ar-ft">'+(a.ar!=null? (a.ar.toLocaleString('hu-HU')+' Ft') : '<span class="hiba">nincs</span>')+'</td>'+
        '<td>'+shopStatuszChip(a)+'</td>'+
      '</tr>';
    }).join('');
    return '<div class="card">'+
      '<div class="termek-head">'+
        '<h3>'+esc(p.termek_nev)+' <span style="color:#888;font-size:13px;font-weight:400;">('+esc(p.meret||'?')+')</span></h3>'+
        '<span class="rank-badge '+rankOsztaly(pz)+'">'+rankCimke(pz)+'</span>'+
      '</div>'+
      '<table><thead><tr><th>Shop</th><th>Termék</th><th>Ár</th><th>Állapot</th></tr></thead><tbody>'+sorok+'</tbody></table>'+
      ((p.konkurens_allapot&&p.konkurens_allapot.length)?'<div class="note">ℹ️ Konkurens árak ('+p.konkurens_allapot.map(function(s){return s.nev;}).join(', ')+') még fejlesztés alatt – folyamatosan kerülnek be.</div>':'')+
      '<div class="note">Radovin ár: <strong>'+(pz.radovin_ar!=null? pz.radovin_ar.toLocaleString('hu-HU')+' Ft':'—')+'</strong> · min: <strong>'+(pz.min!=null?pz.min.toLocaleString('hu-HU')+' Ft':'—')+'</strong> · max: <strong>'+(pz.max!=null?pz.max.toLocaleString('hu-HU')+' Ft':'—')+'</strong> · medián: '+(pz.median!=null?pz.median.toLocaleString('hu-HU')+' Ft':'—')+'</div>'+
    '</div>';
  }).join('');
}

function elozmenyRendre(){
  var wrap=document.getElementById('elozmeny-list');
  if(!elozmeny || Object.keys(elozmeny).length===0){ wrap.innerHTML='<div class="card">Még nincs árelőzmény.</div>'; return; }
  wrap.innerHTML=Object.entries(elozmeny).map(function(par){
    var id=par[0], futasok=par[1];
    var sorok=[].concat(futasok).reverse().slice(0,12).map(function(f){
      return '<tr>'+
        '<td>'+new Date(f.ido).toLocaleString('hu-HU')+'</td>'+
        '<td>'+(f.radovin_ar!=null?f.radovin_ar.toLocaleString('hu-HU')+' Ft':'—')+'</td>'+
        '<td>'+(f.median!=null?f.median.toLocaleString('hu-HU')+' Ft':'—')+'</td>'+
        '<td><span class="rank-badge '+rankOsztaly({rank:f.rank,darab:f.rank})+'">'+(f.rank||'—')+'</span></td>'+
      '</tr>';
    }).join('');
    return '<div class="card"><h3 style="color:var(--bor);font-size:15px;margin-bottom:8px;">'+esc(id)+'</h3>'+
      '<table><thead><tr><th>Időpont</th><th>Radovin</th><th>Medián</th><th>Hely</th></tr></thead><tbody>'+sorok+'</tbody></table></div>';
  }).join('');
}

document.getElementById('kereso').addEventListener('input',function(){jelenRendre();});

// ---- Terméktárház renderelés (URL-kulcsú idősor a termekek.json-ből) ----
var shopDomain={borhalo:'https://borhalo.hu',borvilag:'https://www.borvilag.hu',borpiac:'https://borpiac.hu',winehub:'https://winehub.hu',radovin:'https://radovin.hu',italpark:'https://www.italpark.hu'};

function tarhazRendre(){
  var wrap=document.getElementById('tarhaz-list');
  var meta=document.getElementById('tarhaz-meta');
  if(!tarhaz || !Object.keys(tarhaz).length){
    wrap.innerHTML='<div class="card">Még nincs gyűjtött termék. (A futás minden konkrét, elérhető terméket – név + weblink + ár + dátum – elment a Terméktárházba, akkor is, ha nem párosítható a katalógus egyik tételéhez sem.)</div>';
    meta.textContent='';
    return;
  }
  var q=(document.getElementById('tarhaz-kereso').value||'').toLowerCase();
  var bejegyzesek=Object.entries(tarhaz)
    .map(function(par){var url=par[0],sorozat=par[1];var leg=sorozat[sorozat.length-1]||{};return {url:url,nev:leg.nev||'',shop:leg.shop||'',arsor:leg.ar,idok:sorozat};})
    .filter(function(x){return (x.nev||'').toLowerCase().includes(q)||(x.url||'').toLowerCase().includes(q)||(x.shop||'').toLowerCase().includes(q);});
  meta.textContent=Object.keys(tarhaz).length+' gyűjtött terméklink · '+bejegyzesek.length+' találat';
  wrap.innerHTML=bejegyzesek.slice(0,300).map(function(x){
    var leg=x.idok[x.idok.length-1];
    var valtozott=x.idok.length>1&&x.idok[x.idok.length-1].ar!==x.idok[0].ar;
    var domain=shopDomain[x.shop]||'https://borhalo.hu';
    var teljesUrl=x.url.indexOf('http')===0?x.url:(domain+x.url);
    return '<div class="card" style="margin-bottom:10px;padding:12px 14px;">'+
      '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;">'+
        '<div style="min-width:0;">'+
          '<div style="font-weight:600;color:var(--bor);font-size:14px;">'+esc(x.nev||x.url)+'</div>'+
          '<div style="font-size:12px;color:#888;margin-top:2px;">'+(x.shop?('<strong>'+esc(x.shop)+'</strong> · '):'')+esc(teljesUrl)+'</div>'+
          '<a class="btn small" style="margin-top:6px;display:inline-block;padding:6px 10px;border:none;border-radius:6px;background:var(--bor);color:#fff;font-size:12px;text-decoration:none;" href="'+teljesUrl+'" target="_blank" rel="noopener">🔗 Megnyitás</a>'+
        '</div>'+
        '<div style="text-align:right;">'+
          '<div class="ar-ft">'+(leg.ar!=null? leg.ar.toLocaleString('hu-HU')+' Ft':'—')+'</div>'+
          '<div style="font-size:11px;color:#666;">'+(leg.ido?new Date(leg.ido).toLocaleDateString('hu-HU'):'')+'</div>'+
          (valtozott?'<div style="font-size:11px;color:var(--piros);">⚡ árváltozás</div>':'')+
          '<div style="font-size:11px;color:#888;">'+x.idok.length+' mérés</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
  if(!bejegyzesek.length) wrap.innerHTML='<div class="card">Nincs a keresésnek megfelelő gyűjtött termék.</div>';
}
document.getElementById('tarhaz-kereso').addEventListener('input',function(){tarhazRendre();});

betolt();
</script>
</body>
</html>
